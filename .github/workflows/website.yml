# 공식 웹사이트를 GitHub Pages로 배포한다.
#
# 언제 돌아가는가:
#  1. website/ 가 바뀐 커밋을 main에 push할 때
#  2. release.yml이 새 릴리스를 만든 뒤 트리거할 때(최신 버전/다운로드 링크 갱신)
#  3. 수동 실행(workflow_dispatch)
#
# 사이트는 빌드 시점에 최신 릴리스를 한 번 조회해 HTML에 값을 박아 넣는다.
# 방문자 브라우저는 GitHub API를 호출하지 않으므로 rate limit이나 API 장애로 깨지지 않는다.
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
      # 사이트가 앱의 원본을 직접 읽어 페이지를 만든다. 이 파일들이 바뀌면 사이트 내용도
      # 달라지므로 함께 트리거해야 한다 — 빠뜨리면 사이트만 옛 내용을 계속 보여준다.
      - 'src/engine/issueDb.js'   # → 문제 해결 가이드 페이지
      - 'docs/USER-GUIDE.md'      # → 사용 설명서 페이지
      - 'docs/TECHNICAL.md'       # → 기술 문서 페이지
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 번 배포되지 않도록 한다(릴리스 직후 트리거와 push가 겹칠 수 있다)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 사이트 빌드
        working-directory: website
        run: node build.js
        env:
          # 저장소 변수로 덮어쓸 수 있다. 없으면 site.config.json 값을 쓴다.
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          SITE_URL: ${{ vars.SITE_URL }}
          ANALYTICS_ID: ${{ vars.ANALYTICS_ID }}
          # 인증된 API 호출(시간당 1000회) — 미인증 60회 제한을 피한다
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드 결과 검증
        run: |
          set -e
          cd website/dist
          for f in index.html download.html faq.html 404.html styles.css favicon.svg robots.txt sitemap.xml \
                   guides.html learn.html user-guide.html technical.html og.png \
                   fonts/diagbench-sans.woff2; do
            test -s "$f" || { echo "누락: $f"; exit 1; }
          done

          # 글꼴 원본(2 MB)이 실수로 public/에 남아 함께 배포되는 것을 막는다.
          # 서브셋만 나가야 한다 — 원본이 섞이면 서브셋을 만든 의미가 없어진다.
          font_kb=$(du -k fonts/diagbench-sans.woff2 | cut -f1)
          test "$font_kb" -lt 500 || { echo "글꼴이 ${font_kb}KB다. 원본이 섞였는지 확인할 것"; exit 1; }
          test "$(ls fonts | wc -l)" -eq 1 || { echo "fonts/에 파일이 여러 개다: $(ls fonts)"; exit 1; }

          # 지식 DB에서 생성되는 가이드 페이지가 실제로 만들어졌는지 확인한다.
          # (issueDb를 못 읽으면 build.js가 조용히 0개를 만들고 끝날 수 있다)
          guides=$(ls guide-*.html 2>/dev/null | wc -l)
          test "$guides" -ge 10 || { echo "가이드 페이지가 $guides개뿐입니다 (10개 이상이어야 함)"; exit 1; }
          echo "가이드 페이지 $guides개"

          # 치환되지 않은 템플릿 변수가 남아 있으면 실패시킨다
          if grep -o '{{[A-Z_]*}}' *.html | head -5 | grep -q .; then
            echo "치환되지 않은 템플릿 변수가 있습니다:"
            grep -o '{{[A-Z_]*}}' *.html | sort -u
            exit 1
          fi

          # 구조화 데이터가 유효한 JSON인지 확인한다. 깨진 JSON-LD는 브라우저에서 티가 안 나고
          # 검색엔진에서만 조용히 무시되므로, 배포 전에 여기서 잡는다.
          node -e '
            const fs = require("fs");
            let n = 0;
            for (const f of fs.readdirSync(".").filter((x) => x.endsWith(".html"))) {
              const html = fs.readFileSync(f, "utf-8");
              for (const m of html.matchAll(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/g)) {
                try { JSON.parse(m[1]); n++; }
                catch (e) { console.error(`${f}: JSON-LD 파싱 실패 — ${e.message}`); process.exit(1); }
              }
            }
            console.log(`구조화 데이터 ${n}개 유효`);
          '
          echo "검증 통과"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
