# 일상 CI — 태그가 아닌 push/PR에서 돌아간다.
# release.yml과 역할을 나눈 이유: 릴리스 워크플로는 태그에서만 돌아야 하는데(요구사항 16-테스트1),
# 그러면 평소 커밋에서 아무 검증도 안 되기 때문이다. 여기서 테스트와 빌드 가능 여부만 확인하고
# 서명·릴리스는 하지 않는다.
name: Build

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']      # 태그 push는 release.yml이 처리한다(중복 실행 방지)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 규칙 엔진 테스트
    runs-on: ubuntu-latest    # 규칙 엔진은 순수 JS라 OS 무관 — 빠르고 저렴한 쪽에서 돌린다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'          # ~/.npm(레지스트리 캐시)만 캐싱된다. electron 바이너리는 별도(아래).

      # electron 패키지는 설치 시 ~106MB 바이너리를 따로 내려받는다(postinstall).
      # setup-node의 npm 캐시는 이걸 덮지 않으므로 캐시 경로를 명시하고 따로 캐싱한다.
      # 캐시가 맞으면 install.js가 로컬 파일을 쓰고 네트워크를 타지 않는다.
      - name: electron 버전 확인 (캐시 키용)
        id: ev
        shell: bash
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")" >> $GITHUB_OUTPUT

      - name: electron 바이너리 캐시
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/electron
          key: electron-${{ runner.os }}-${{ steps.ev.outputs.version }}

      - name: 의존성 설치
        run: node scripts/retry.js npm ci
        env:
          # install.js가 참조하는 캐시 경로(실측 확인: cacheRoot: process.env.electron_config_cache)
          electron_config_cache: ${{ github.workspace }}/.cache/electron
          # npm 레지스트리 쪽 일시적 오류에 대한 재시도(다운로드와는 별개 경로)
          NPM_CONFIG_FETCH_RETRIES: '5'
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'

      - name: 회귀 테스트 (130개)
        run: npm run test-rules

  build:
    name: Windows 빌드 확인
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: electron 버전 확인 (캐시 키용)
        id: ev
        shell: bash
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")" >> $GITHUB_OUTPUT

      - name: electron 바이너리 캐시
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/electron
          key: electron-${{ runner.os }}-${{ steps.ev.outputs.version }}

      # electron-builder도 빌드 시점에 별도 리소스를 내려받는다(winCodeSign, nsis 등).
      # 같은 종류의 네트워크 실패가 여기서도 날 수 있어 함께 캐싱한다.
      - name: electron-builder 캐시
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ steps.ev.outputs.version }}

      - name: 의존성 설치
        run: node scripts/retry.js npm ci
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron
          NPM_CONFIG_FETCH_RETRIES: '5'
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'

      # ⚠ --publish never 를 반드시 붙인다.
      # electron-builder는 CI 환경을 감지하면 **태그가 없어도** 암묵적으로 GitHub Release
      # publish를 시도한다("Implicit publishing triggered by CI detection"). 그러면
      # GH_TOKEN이 없어서 빌드가 실패한다 — 실제로 이 CI에서 발생했다.
      # 이 워크플로는 빌드 가능 여부만 확인하는 곳이고 릴리스는 release.yml이 태그 기준으로
      # 따로 만들기 때문에, 여기서 publish할 이유가 전혀 없다.
      - name: 설치 파일 빌드 (publish 안 함)
        run: node scripts/retry.js npm run build:win -- --publish never
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

      # 빌드가 "성공"했다고 보고했어도 산출물이 없을 수 있다. 실제로 확인한다.
      - name: 산출물 검증
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist\*.exe" | Where-Object { $_.Name -notlike '*uninstaller*' } | Select-Object -First 1
          if (-not $exe) { throw "설치 파일이 생성되지 않았습니다." }
          Write-Host "파일: $($exe.Name)"
          Write-Host "크기: $([math]::Round($exe.Length/1MB,1)) MB"
          # 74MB 안팎이 정상. 극단적으로 작으면 리소스가 빠진 것이다.
          if ($exe.Length -lt 40MB) { throw "설치 파일이 비정상적으로 작습니다($([math]::Round($exe.Length/1MB,1))MB) — 리소스 누락 의심" }
          # 동봉해야 하는 smartctl이 실제로 패키징됐는지 확인
          $smartctl = "dist\win-unpacked\resources\smartmontools\smartctl.exe"
          if (-not (Test-Path $smartctl)) { throw "smartctl.exe가 패키징되지 않았습니다 — SMART 진단이 동작하지 않습니다." }
          Write-Host "smartctl 동봉 확인: OK"
