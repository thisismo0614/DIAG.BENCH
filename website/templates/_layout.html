<!DOCTYPE html>
<html lang="{{HTML_LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{PAGE_DESC}}">
<link rel="canonical" href="{{CANONICAL}}">

<meta property="og:type" content="{{OG_TYPE}}">
<meta property="og:site_name" content="{{PRODUCT_NAME}}">
<meta property="og:title" content="{{PAGE_TITLE}}">
<meta property="og:description" content="{{PAGE_DESC}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:locale" content="{{OG_LOCALE}}">
{{HREFLANG}}
<meta property="og:image" content="{{SITE_URL}}/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{PRODUCT_NAME}} — {{TAGLINE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{PAGE_TITLE}}">
<meta name="twitter:description" content="{{PAGE_DESC}}">
<meta name="twitter:image" content="{{SITE_URL}}/og.png">

<link rel="icon" href="{{ASSET}}favicon.svg" type="image/svg+xml">
<!-- 글꼴은 CSS를 받아서 파싱한 뒤에야 발견된다. 미리 알려주면 그만큼 일찍 시작해
     본문이 맑은 고딕으로 보였다가 바뀌는 구간이 짧아진다.
     crossorigin은 같은 출처라도 필수다 — 없으면 브라우저가 따로 한 번 더 받는다. -->
<link rel="preload" href="{{ASSET}}fonts/diagbench-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ASSET}}styles.css">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "{{PRODUCT_NAME}}",
  "applicationCategory": "UtilitiesApplication",
  "operatingSystem": "Windows 10, Windows 11",
  "description": "{{DESCRIPTION}}",
  "url": "{{SITE_URL}}",
  "downloadUrl": "{{DOWNLOAD_URL}}",
  "softwareVersion": "{{VERSION}}",
  "inLanguage": "{{HTML_LANG}}",
  "license": "https://opensource.org/licenses/MIT",
  "isAccessibleForFree": true,
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KRW" }
}
</script>
{{PAGE_JSONLD}}
{{ANALYTICS}}
</head>
<body>

<a class="skip-link" href="#main">{{SKIP_LINK}}</a>

{{HEADER}}

<main id="main">
{{CONTENT}}
</main>

{{FOOTER}}

</body>
</html>
